spring:
  application:
    name: ai-job-assistant
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/ai_job_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
